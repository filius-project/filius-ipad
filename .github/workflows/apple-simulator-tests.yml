name: Apple Simulator Tests

on:
  workflow_dispatch:
    inputs:
      test_profile:
        description: Hosted simulator suite to run; use full for release candidates
        required: true
        default: full
        type: choice
        options:
          - full
          - unit
          - editor-ui
          - visual-ui
          - persistence-ui
          - runtime-ui
          - app-launch-ping-ui
          - desktop-ui
          - service-ui
          - simulation-ui

permissions:
  contents: read

concurrency:
  group: apple-simulator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-suites:
    name: Select hosted test suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build suite matrix
        id: matrix
        env:
          TEST_PROFILE: ${{ inputs.test_profile }}
        run: |
          set -euo pipefail
          case "$TEST_PROFILE" in
            full)
              matrix='{"profile":["unit","editor-ui","visual-ui","persistence-ui","app-launch-ping-ui","desktop-ui","service-ui","simulation-ui"]}'
              ;;
            runtime-ui)
              matrix='{"profile":["app-launch-ping-ui","desktop-ui","service-ui","simulation-ui"]}'
              ;;
            unit|editor-ui|visual-ui|persistence-ui|app-launch-ping-ui|desktop-ui|service-ui|simulation-ui)
              matrix="{\"profile\":[\"$TEST_PROFILE\"]}"
              ;;
            *)
              echo "Unsupported test profile: $TEST_PROFILE" >&2
              exit 2
              ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Selected matrix: $matrix"

  test:
    name: Hosted iPad - ${{ matrix.profile }}
    needs: select-suites
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.select-suites.outputs.matrix) }}
    runs-on: macos-26
    timeout-minutes: 75
    env:
      TEST_OUTPUT_DIR: ios/build/simulator-tests/${{ matrix.profile }}
      DERIVED_DATA_PATH: ios/build/simulator-derived-data/${{ matrix.profile }}
      RESULT_BUNDLE_PATH: ios/build/simulator-tests/${{ matrix.profile }}/FiliusPadTests.xcresult
      TEST_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate simulator selection helper
        run: |
          set -euo pipefail
          python3 -m unittest scripts.ci.test_select_ios_simulator -v

      - name: Record toolchain and select an available iPad
        id: simulator
        run: |
          set -euo pipefail
          mkdir -p "$TEST_OUTPUT_DIR/logs"
          xcodebuild -version | tee "$TEST_OUTPUT_DIR/logs/xcode-version.log"
          xcrun --sdk iphonesimulator --show-sdk-version | tee "$TEST_OUTPUT_DIR/logs/ios-simulator-sdk-version.log"
          xcodebuild \
            -project ios/FiliusPad.xcodeproj \
            -scheme FiliusPad \
            -showdestinations 2>&1 | tee "$TEST_OUTPUT_DIR/logs/xcode-destinations.log"
          xcrun simctl list devices available -j | tee "$TEST_OUTPUT_DIR/logs/simulators.json"
          python3 scripts/ci/select_ios_simulator.py \
            --input "$TEST_OUTPUT_DIR/logs/simulators.json" \
            --github-output "$GITHUB_OUTPUT" \
            | tee "$TEST_OUTPUT_DIR/logs/selected-simulator.json"

      - name: Boot selected iPad simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build app and run selected tests
        id: tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          set -o pipefail
          rm -rf "$DERIVED_DATA_PATH" "$RESULT_BUNDLE_PATH"

          case "$TEST_PROFILE" in
            unit)
              TEST_ARGS=(-only-testing:FiliusPadTests)
              ;;
            editor-ui)
              TEST_ARGS=(
                -only-testing:FiliusPadUITests/FiliusPadUITests
                -only-testing:FiliusPadUITests/TopologyEditorTouchFlowUITests
                -only-testing:FiliusPadUITests/TopologyInfrastructureParityUITests
                -only-testing:FiliusPadUITests/TopologyIntegratedAcceptanceUITests
              )
              ;;
            visual-ui)
              TEST_ARGS=(-only-testing:FiliusPadUITests/TopologyVisualRegressionUITests)
              ;;
            persistence-ui)
              TEST_ARGS=(-only-testing:FiliusPadUITests/TopologyProjectPersistenceWorkflowUITests)
              ;;
            app-launch-ping-ui)
              TEST_ARGS=(
                -only-testing:FiliusPadUITests/TopologyRuntimeAppLaunchParityUITests
                -only-testing:FiliusPadUITests/TopologyRuntimePingWorkflowUITests
              )
              ;;
            desktop-ui)
              TEST_ARGS=(-only-testing:FiliusPadUITests/TopologyRuntimeDesktopSuiteParityUITests)
              ;;
            service-ui)
              TEST_ARGS=(-only-testing:FiliusPadUITests/TopologyRuntimeServiceAppParityUITests)
              ;;
            simulation-ui)
              TEST_ARGS=(-only-testing:FiliusPadUITests/TopologySimulationRuntimeUITests)
              ;;
            *)
              echo "Unsupported matrix profile: $TEST_PROFILE" >&2
              exit 2
              ;;
          esac

          printf 'Selected matrix profile: %s\n' "$TEST_PROFILE" | tee "$TEST_OUTPUT_DIR/logs/test-profile.log"
          printf 'Test argument: %s\n' "${TEST_ARGS[@]}" | tee -a "$TEST_OUTPUT_DIR/logs/test-profile.log"

          xcodebuild \
            -project ios/FiliusPad.xcodeproj \
            -scheme FiliusPad \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            "${TEST_ARGS[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$TEST_OUTPUT_DIR/logs/xcodebuild-test.log"

      - name: Collect simulator diagnostics
        if: always() && steps.simulator.outputs.udid != ''
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p "$TEST_OUTPUT_DIR/diagnostics"
          xcrun simctl io "$SIMULATOR_UDID" screenshot \
            "$TEST_OUTPUT_DIR/diagnostics/simulator-final.png" || true
          xcrun simctl spawn "$SIMULATOR_UDID" log show \
            --style compact \
            --last 10m \
            --predicate 'process == "FiliusPad" OR process CONTAINS "FiliusPadUITests"' \
            > "$TEST_OUTPUT_DIR/diagnostics/simulator.log" 2>&1 || true
          xcrun simctl shutdown "$SIMULATOR_UDID" || true

      - name: Upload test and debugging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FiliusPad-simulator-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TEST_OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Publish test summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
          SIMULATOR_RUNTIME: ${{ steps.simulator.outputs.runtime }}
        run: |
          {
            echo "### Apple Simulator Tests - $TEST_PROFILE"
            echo
            echo "- Outcome: \`$TEST_OUTCOME\`"
            echo "- Simulator: \`$SIMULATOR_NAME\`"
            echo "- Runtime: \`$SIMULATOR_RUNTIME\`"
            echo "- Evidence artifact: \`FiliusPad-simulator-${TEST_PROFILE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
            echo
            echo "Hosted simulator evidence supplements, but does not replace, the real-iPad release protocol."
          } >> "$GITHUB_STEP_SUMMARY"
